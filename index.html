<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100a07" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Alea Brettspiel Café & Bar in Zürich: über 180 Spiele, Cocktails und Craft-Bier. Eintritt CHF 7 pro Person, ganz ohne Zeitlimit."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alea Spielbar" />
    <meta property="og:title" content="Alea Spielbar — Brettspiel Café & Bar in Zürich" />
    <meta
      property="og:description"
      content="Über 180 Spiele, Cocktails und Craft-Bier. Eintritt CHF 7 pro Person, ganz ohne Zeitlimit."
    />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/logo.png" />
    <!--
      Explicitly allows framing Google Maps. Harmless when no CSP header exists at all (the
      common case for a static host), but it's also the documented fix for the Google Maps
      embed rendering as "This content is blocked. Contact the site owner to fix the issue." —
      a default-src CSP with no frame-src exception for google.com. A <meta> CSP can't override
      a *stricter* CSP the hosting layer sends as an HTTP header, only add a policy where none
      existed — if that ever turns out to be the cause here, the same frame-src needs adding to
      the host's response headers too.
    -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self' https://www.google.com https://maps.google.com;" />
    <title>Alea Spielbar</title>
    <script>
      // Applies a saved 'dark' preference before first paint, so there's no flash of the
      // (default) light theme. Runs synchronously and inline — a deferred module script
      // would run after the first frame is already painted.
      try {
        if (localStorage.getItem('alea-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (_) {
        // Private browsing / storage disabled — falls back to the light default.
      }
    </script>
  </head>
  <body class="bg-felt">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
